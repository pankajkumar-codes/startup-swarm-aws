name: Deploy

# main        -> beta  (every merge, after CI)
# tag v*.*.*  -> prod  (after CI, and after a required reviewer approves the "prod" environment)
#
# Uses GitHub OIDC; no AWS keys are stored in GitHub. Until AWS_DEPLOY_ROLE_ARN is set on
# an environment, its deploy job is skipped with a notice. One-time setup: README > CI/CD.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy"
        type: choice
        options: [beta, prod]
        default: beta

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.stage) || (startsWith(github.ref, 'refs/tags/') && 'prod') || 'beta' }}
    permissions:
      id-token: write
      contents: read
    env:
      STAGE: ${{ (github.event_name == 'workflow_dispatch' && inputs.stage) || (startsWith(github.ref, 'refs/tags/') && 'prod') || 'beta' }}
    steps:
      - name: Skip if AWS is not connected yet
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
        run: echo "::notice::AWS_DEPLOY_ROLE_ARN is not set for the ${{ env.STAGE }} environment, so deploy is skipped. See README > CI/CD."
      - uses: actions/checkout@v5
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
      - uses: actions/setup-python@v6
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          node-version: "20"
      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Deploy infrastructure
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        working-directory: infrastructure
        run: |
          pip install -r requirements.txt
          npm install -g aws-cdk
          SUFFIX=$([ "$STAGE" = "prod" ] && echo Prod || echo Beta)
          cdk deploy "StartupSwarm-$SUFFIX" -c stage=$STAGE \
            --require-approval never --outputs-file cdk-outputs-$STAGE.json
      - uses: actions/upload-artifact@v4
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        with:
          name: cdk-outputs-${{ env.STAGE }}
          path: infrastructure/cdk-outputs-${{ env.STAGE }}.json
